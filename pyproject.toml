[project]
name = "freeinference-pr-engineering"
version = "0.1.0"
description = "Unified FreeInference PR engineering system for Mistral Vibe Web and Vibe CLI: managed multi-agent PR review with deterministic workflow state."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-workflows[mistralai]>=3.19.0",
    "mistralai-agents>=1.1.0",
    "pydantic>=2.14.1",
    "httpx>=0.27.0",
]

[project.scripts]
fi-pr = "freeinference_pr.cli:main"
freeinference-pr-worker = "freeinference_pr.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "freeinference_pr"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
index-strategy = "first-index"
